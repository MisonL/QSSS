[project]
name = "qsss"
version = "2.0.0"
description = "Quantitative Stock Selection System - A professional A-share quantitative trading strategy system"
authors = [
    {name = "Mison", email = "1360962086@qq.com"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["quantitative", "trading", "a-share", "machine-learning", "stock-selection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "pytdx>=1.72",
    "akshare>=1.8.0",
    "baostock>=0.8.8",
    "scikit-learn>=0.24.0",
    "lightgbm>=3.3.0",
    "psutil>=5.8.0",
    "tqdm>=4.65.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.6.0",
    "click>=8.0.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "isort>=5.9",
    "flake8>=3.9",
    "mypy>=0.910",
]
tushare = [
    "tushare>=1.2.89",
]

[project.scripts]
qsss = "qsss.cli:main"

[project.urls]
Homepage = "https://github.com/MisonL/QSSS"
Repository = "https://github.com/MisonL/QSSS"
Issues = "https://github.com/MisonL/QSSS/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
addopts = "-m 'not external'"
markers = [
  "external: tests that depend on external data providers (pytdx / Tushare / Baostock) and are not run by default",
]
